name: 채용공고 업데이트

on:
  schedule:
    - cron: "17 21 * * *"   # 매일 06:17 (한국시간)
    - cron: "17 9 * * *"    # 매일 18:17 (한국시간)
  workflow_dispatch:          # Actions 탭에서 'Run workflow'로 바로 실행
  push:
    branches: [main]
    paths: ["docs/index.html", "docs/data/links.json", "collector/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: food-jobs-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55        # 사람인 검색 화면 수집이 오래 걸려도 여기서 끊음 (상세 300건 기준 약 25~30분)
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements-dev.txt

      - name: 테스트 (분류 규칙 점검)
        run: python -m pytest -q

      - name: 공고 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          WORK24_KEY: ${{ secrets.WORK24_KEY }}
          SARAMIN_KEY: ${{ secrets.SARAMIN_KEY }}
          SARAMIN_WEB: "1"     # SARAMIN_KEY가 없으면 사람인 검색 화면에서 대신 수집 (키를 넣으면 자동으로 API)
        run: python -m collector.main

      - name: 수집 결과 저장 (NEW 표시·이전 데이터 유지용)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/jobs.json
          for f in docs/data/salary_public.json docs/data/companies.json; do [ -f "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: 채용공고 업데이트 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git pull --rebase --autostash
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
